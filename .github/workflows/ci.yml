name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vox.csproj

      - name: Build
        run: dotnet build Vox.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests\Vox.Tests\Vox.Tests.csproj -c Release --no-restore